# Buzz Lightyear — nginx reverse proxy for the remote pairing server
#
# Upstream app (on the same host):
#   WEB_HOST=127.0.0.1
#   WEB_PORT=8080
#   uv run python -m webapp
#
# Install (Debian/Ubuntu-style paths):
#   sudo cp deploy/nginx/pairing-server.conf /etc/nginx/sites-available/pairing-server
#   # edit server_name and ssl_certificate* paths below
#   sudo ln -sf /etc/nginx/sites-available/pairing-server /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS with certbot (after DNS points here):
#   sudo certbot --nginx -d pair.example.com
#   # or place certs under /etc/letsencrypt/live/<domain>/ and use the SSL block as-is

upstream buzz_pairing {
    # Flask app; keep it bound to loopback (WEB_HOST=127.0.0.1).
    server 127.0.0.1:8080;
    keepalive 8;
}

# Optional light rate limits (pair start is public; identity API is key-gated).
limit_req_zone $binary_remote_addr zone=pairing_start:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pairing_api:10m rate=60r/m;

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pair.example.com;

    # ACME HTTP-01 (certbot / LE)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS reverse proxy
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pair.example.com;

    # --- TLS (replace domain or let certbot rewrite these paths) ---
    ssl_certificate     /etc/letsencrypt/live/pair.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pair.example.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/pair.example.com/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern intermediate-ish defaults; prefer Mozilla SSL Config Generator
    # for current cipher lists: https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS — enable only after HTTPS works end-to-end
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Hardening (pairing UI is public; APIs still need auth/token on the app)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Pairing payloads are small JSON; keep body limit low.
    client_max_body_size 64k;

    # Real client IP when behind another proxy/CDN (optional)
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    # Access / error logs
    access_log /var/log/nginx/buzz-pairing.access.log;
    error_log  /var/log/nginx/buzz-pairing.error.log;

    # --- Owner UI + static (Flask serves /static) ---
    location / {
        proxy_pass http://buzz_pairing;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Owner UI polls /api/pairing/status while waiting on Connect scan.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Stricter limits on public pairing mutations
    location = /api/pairing/start {
        limit_req zone=pairing_start burst=5 nodelay;

        proxy_pass http://buzz_pairing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location = /api/pairing/reset {
        limit_req zone=pairing_start burst=5 nodelay;

        proxy_pass http://buzz_pairing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # Polling + health + controller identity
    location /api/ {
        limit_req zone=pairing_api burst=30 nodelay;

        proxy_pass http://buzz_pairing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Authorization / X-Api-Key pass through by default; no need to list them.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Optional: refuse direct access to anything else odd
    # location ~ /\. { deny all; }
}
